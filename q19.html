<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Security Demo</title>
</head>
<body>
  <h1>Secure Form Example</h1>

  <form method="post" action="#" autocomplete="off">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <input type="submit" value="Submit">
  </form>

  <p>Note: autocomplete="off" prevents browsers from suggesting saved input values, enhancing form security. All fields are required to ensure complete submission.</p>
</body>
</html>
