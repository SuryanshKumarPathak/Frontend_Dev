<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dropdown Selection Page</title>
  </head>
  <body>
    <header>
      <h1>Dropdown-based Selection Page</h1>
      <hr />
    </header>

    <main>
      <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
          <option value="india" selected>India</option>
          <option value="usa">USA</option>
          <option value="france">France</option>
        </select>
        <br /><br />

        <label for="state">State:</label>
        <select id="state" name="state">
          <option value="karnataka" selected>Karnataka</option>
          <option value="maharashtra">Maharashtra</option>
          <option value="tamilnadu">Tamil Nadu</option>
        </select>
        <br /><br />

        <label for="city">City:</label>
        <select id="city" name="city">
          <option value="bengaluru" selected>Bengaluru</option>
          <option value="mumbai">Mumbai</option>
          <option value="chennai">Chennai</option>
        </select>
        <br /><br />

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
          <option value="mumbai_beach">Mumbai Beach</option>
          <option value="palolem" selected>Palolem Beach</option>
          <option value="eiffel">Eiffel Tower</option>
        </select>
      </form>

      <p>Summary: I am from <strong>India</strong>, state <strong>Karnataka</strong>, city <strong>Bengaluru</strong>, and my favorite tourist place is <strong>Palolem Beach</strong>.</p>
    </main>

    <footer>
      <hr />
      <p>&copy; 2025 Travel Explorer. All rights reserved.</p>
    </footer>
  </body>
</html>
