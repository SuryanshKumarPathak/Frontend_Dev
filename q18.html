<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotations Example</title>
</head>
<body>
  <h1>Quotations Demo</h1>

  <blockquote>
    "The only limit to our realization of tomorrow is our doubts of today. Always remember that learning & growth go hand in hand, and never let fear hold you back."
  </blockquote>

  <p>
    As someone once said, <q>Success is not final & failure is not fatal.</q> These words remind us to keep moving forward.
  </p>
</body>
