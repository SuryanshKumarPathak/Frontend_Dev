<!DOCTYPE html>
<html>
    <head>
        <title>IFrame</title>
    </head>
    <body>
        <header>
        <h1>Responsive youtube video</h1>
        <hr/>
        </header>
        <main>
            <p>Enjoy this video</p>
            <iframe
            width="80%"
            height="50%"
            src="https://www.youtube.com/embed/g5XHXSOmONk?si=Z-_bhpJDY3cJ1W2B"
            title="YouTube_video_player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
            </iframe>
            
        </main>
    </body>
    </body>
</html>
