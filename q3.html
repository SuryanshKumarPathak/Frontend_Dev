<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframes Example – Introduction & Hobby</title>
  </head>
  <body>
    <header>
      <h1>My Introduction and Hobby Pages</h1>
      <hr />
    </header>

    <main>
      <h2>Introduction</h2>
      <iframe 
        src="introduction.html" 
        title="My Introduction Page" 
        width="90%" 
        height="300" 
        style="border: 2px solid #000;">
      </iframe>

      <br><br>
      <h2>My Favorite Hobby</h2>
      <iframe 
        src="hobby.html" 
        title="My Hobby Page" 
        width="90%" 
        height="300" 
        style="border: 2px solid #000;">
      </iframe>
    </main>

    <footer>
      <hr />
      <p>&copy; 2025 My Iframe Showcase</p>
    </footer>
  </body>
</html>
