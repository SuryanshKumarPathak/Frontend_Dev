<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Title of the webpage displayed in browser tab -->
  <title>Complete Head Elements Example</title>

  <!-- Character encoding ensures proper display of all characters -->
  <meta charset="UTF-8">

  <!-- Description of the page for search engines -->
  <meta name="description" content="This page demonstrates all important head elements in HTML.">

  <!-- Author of the webpage -->
  <meta name="author" content="Your Name">

  <!-- Base URL for all relative links on the page -->
  <base href="https://www.example.com/">

  <!-- Link to a favicon or other resource -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Internal CSS styles can be written here -->
  <style>
    /* Add CSS styles here */
  </style>

  <!-- JavaScript can be written here -->
  <script>
    // Add JavaScript here
  </script>
</head>
<body>
  <h1>Welcome to the Complete Head Elements Demo</h1>
  <p>This page includes title, meta, base, link, style, and script tags in the head section.</p>
</body>
</html>
